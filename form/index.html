<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <fieldset class="form">
        <div>Ваши личные данные</div>

        <label for="name" class="box-input">Ваше имя</label>
        <input type="text" id="name" placeholder="Имя" required />

        <label for="age" class="box-input">Ваш возраст</label>
        <input type="number" id="age" placeholder="Ваш возраст" required />

        <label for="tel">Ваш номер</label>
        <input type="tel" id="tel" placeholder="Номер телефона" required />

        <label for="email">Почта</label>
        <input
          type="email"
          id="email"
          inputmode="email"
          placeholder="Ваша почта"
          required
        />

        <label for="message">Сообщение</label>
        <textarea
          id="message"
          placeholder="Введите сообщение"
          required
        ></textarea>

        <label>
          <input type="checkbox" name="" id="" required />Я принимаю условия
        </label>
        <button>Отправить форму</button>
      </fieldset>
    </form>
  </body>
</html>
